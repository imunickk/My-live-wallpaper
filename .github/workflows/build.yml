name: Build My Live Wallpaper APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Preserve maintained wallpaper service
        run: |
          set -e
          cp project/MyLiveWallpaper/app/src/main/java/com/nik/mylivewallpaper/VideoWallpaperService.java /tmp/VideoWallpaperService.java

      - name: Extract Android project ZIP
        run: |
          set -e
          mkdir -p project
          unzip -o MyLiveWallpaper-AndroidStudio-Project.zip -d project
          cp /tmp/VideoWallpaperService.java project/MyLiveWallpaper/app/src/main/java/com/nik/mylivewallpaper/VideoWallpaperService.java

      - name: Fix wallpaper source files
        run: |
          set -e
          SERVICE="project/MyLiveWallpaper/app/src/main/java/com/nik/mylivewallpaper/VideoWallpaperService.java"
          ACTIVITY="$(find project -type f -name MainActivity.java -print -quit)"
          test -f "$SERVICE"
          test -n "$ACTIVITY"

          python3 - "$SERVICE" "$ACTIVITY" <<'PY'
          import pathlib
          import re
          import sys

          service = pathlib.Path(sys.argv[1])
          activity = pathlib.Path(sys.argv[2])

          # Use maintained Engine callbacks and retry when the surface dimensions arrive.
          s = service.read_text()
          marker = '            currentHolder = holder;\\n\\n            if (player != null) {'
          if marker in s:
              s = s.replace(marker, '            currentHolder = holder;\\n            startPlayer();\\n\\n            if (player != null) {', 1)
          service.write_text(s)

          a = activity.read_text()
          a = a.replace('getPreferences(MODE_PRIVATE)', 'getSharedPreferences("MyLiveWallpaper", MODE_PRIVATE)')
          activity.write_text(a)

          for gradle in pathlib.Path("project").rglob("app/build.gradle"):
              g = gradle.read_text()
              g = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 35', g)
              g = re.sub(r'compileSdk\s+\d+', 'compileSdk 35', g)
              g = re.sub(r'targetSdkVersion\s+\d+', 'targetSdkVersion 35', g)
              g = re.sub(r'targetSdk\s+\d+', 'targetSdk 35', g)
              gradle.write_text(g)

          print("Patched wallpaper service and shared preferences.")
          PY

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Build APK
        run: |
          set -e
          PROJECT_DIR=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="project/MyLiveWallpaper"
          fi

          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyLiveWallpaper-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
