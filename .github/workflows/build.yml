name: Build My Live Wallpaper APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: |
          set -e
          mkdir -p project
          unzip -o MyLiveWallpaper-AndroidStudio-Project.zip -d project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Replace Java file with corrected version
        run: |
          set -e
          DEST="project/MyLiveWallpaper/app/src/main/java/com/nik/mylivewallpaper"
          mkdir -p "$DEST"
          cp project/MyLiveWallpaper/app/src/main/java/com/nik/mylivewallpaper/VideoWallpaperService.java "$DEST/VideoWallpaperService.java"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project/MyLiveWallpaper
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyLiveWallpaper-APK
          path: project/MyLiveWallpaper/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
