name: Build My Live Wallpaper APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: |
          set -e
          mkdir -p project
          unzip -o MyLiveWallpaper-AndroidStudio-Project.zip -d project

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Build APK
        run: |
          set -e

          echo "Searching for Android Gradle project..."

          PROJECT_DIR=$(find project -type f -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="project/MyLiveWallpaper"
          fi

          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyLiveWallpaper-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
