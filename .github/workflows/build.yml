name: Build My Live Wallpaper APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: |
          set -e
          mkdir -p project
          unzip -o MyLiveWallpaper-AndroidStudio-Project.zip -d project

      - name: Fix wallpaper source files
        run: |
          set -e

          SERVICE="$(find project -type f -name VideoWallpaperService.java -print -quit)"
          ACTIVITY="$(find project -type f -name MainActivity.java -print -quit)"

          test -n "$SERVICE"
          test -n "$ACTIVITY"

          python3 - "$SERVICE" "$ACTIVITY" <<'PY'
          import pathlib
          import re
          import sys

          service = pathlib.Path(sys.argv[1])
          activity = pathlib.Path(sys.argv[2])

          s = service.read_text()
          s = re.sub(
              r'extends\s+Engine\s+implements\s+SurfaceHolder\.Callback',
              'extends Engine',
              s
          )
          s = re.sub(
              r'getSurfaceHolder\(\)\s*\.addCallback\s*\(\s*this\s*\)\s*;?',
              '',
              s
          )
          s = re.sub(r'\bsurfaceCreated\s*\(', 'onSurfaceCreated(', s)
          s = re.sub(r'\bsurfaceChanged\s*\(', 'onSurfaceChanged(', s)
          s = re.sub(r'\bsurfaceDestroyed\s*\(', 'onSurfaceDestroyed(', s)

          # Read the URI from the same preferences file used by the activity.
          s = re.sub(
              r'getSharedPreferences\("MyLiveWallpaper",\s*MODE_PRIVATE\)',
              'getSharedPreferences("MyLiveWallpaper", MODE_PRIVATE)',
              s
          )

          a = activity.read_text()

          # Use a shared named preferences file in both places.
          a = a.replace(
              'getPreferences(MODE_PRIVATE)',
              'getSharedPreferences("MyLiveWallpaper", MODE_PRIVATE)'
          )

          service.write_text(s)
          activity.write_text(a)

          print("Patched:", service)
          print("Patched:", activity)
          PY

          echo "Checking for remaining legacy callback registration:"
          if grep -nE 'addCallback\(this\)|implements SurfaceHolder.Callback' "$SERVICE"; then
            echo "Legacy callback pattern remains; inspect source."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Build APK
        run: |
          set -e
          PROJECT_DIR=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="project/MyLiveWallpaper"
          fi

          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyLiveWallpaper-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
