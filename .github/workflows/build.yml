name: Build My Live Wallpaper APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: |
          set -e
          mkdir -p project
          unzip -o MyLiveWallpaper-AndroidStudio-Project.zip -d project

      - name: Fix VideoWallpaperService callbacks
        run: |
          set -e
          FILE="$(find project -type f -name VideoWallpaperService.java -print -quit)"
          test -n "$FILE"
          echo "Fixing $FILE"

          python3 - "$FILE" <<'PY'
          import pathlib
          import re
          import sys

          p = pathlib.Path(sys.argv[1])
          s = p.read_text()

          # Engine manages its own surface lifecycle callbacks.
          s = re.sub(
              r'extends\s+Engine\s+implements\s+SurfaceHolder\.Callback',
              'extends Engine',
              s
          )

          # Remove addCallback(this), including when it appears
          # inline inside the VideoEngine constructor.
          s = re.sub(
              r'getSurfaceHolder\(\)\s*\.addCallback\s*\(\s*this\s*\)\s*;?',
              '',
              s
          )

          # Convert legacy SurfaceHolder.Callback method names.
          s = re.sub(r'\bsurfaceCreated\s*\(', 'onSurfaceCreated(', s)
          s = re.sub(r'\bsurfaceChanged\s*\(', 'onSurfaceChanged(', s)
          s = re.sub(r'\bsurfaceDestroyed\s*\(', 'onSurfaceDestroyed(', s)

          p.write_text(s)

          if re.search(r'getSurfaceHolder\(\)\s*\.addCallback\s*\(\s*this\s*\)', s):
              raise SystemExit("ERROR: addCallback(this) was not removed")

          print("Wallpaper callback patch completed.")
          PY

          echo "Checking patched source:"
          grep -nE 'class VideoEngine|addCallback|surfaceDestroyed|onSurfaceDestroyed' "$FILE" || true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Build APK
        run: |
          set -e
          PROJECT_DIR=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="project/MyLiveWallpaper"
          fi

          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyLiveWallpaper-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
